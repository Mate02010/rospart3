# Controladores de ros2_control (solo se usan con use_ros2_control:=true).
# Se activan a mano, como pide la guía:
#   ros2 control load_controller --set-state active joint_state_broadcaster
#   ros2 control load_controller --set-state active diff_drive_controller
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Mismas medidas que el URDF y que el plugin de Gazebo.
    wheel_separation: 0.34
    wheel_radius: 0.06
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Odometría calculada con los encoders (no con el comando).
    open_loop: false
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

    # Si deja de llegar /cmd_vel por 0,5 s el robot se detiene.
    cmd_vel_timeout: 0.5

    # Mismas aceleraciones máximas que el plugin de Gazebo.
    linear.x.max_acceleration: 1.0
    angular.z.max_acceleration: 2.0
