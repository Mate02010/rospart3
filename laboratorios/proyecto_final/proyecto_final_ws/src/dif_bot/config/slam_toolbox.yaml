# Práctica 3: SLAM Toolbox en modo online asíncrono (mapeo).
# Parte de config/mapper_params_online_async.yaml de slam_toolbox 2.9 (Kilted);
# lo marcado con (*) se cambió para el dif_bot y la bodega.
# El EKF de la práctica 2 da el TF odom -> base_footprint; slam_toolbox publica
# /map y el TF map -> odom.
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Solver del grafo de poses (igual que el ejemplo).
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Marcos y tópico del láser.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint      # el mismo base_link_frame del EKF
    scan_topic: /scan
    mode: mapping
    use_map_saver: true             # deja disponible /slam_toolbox/save_map

    # Mapa.
    resolution: 0.05                # 5 cm por celda (pregunta 1 de la práctica)
    min_laser_range: 0.12           # (*) rango real del lidar (sensors.xacro)
    max_laser_range: 12.0           # (*) antes 20 m
    map_update_interval: 2.0        # (*) republica /map cada 2 s (antes 5 s)
    transform_publish_period: 0.02  # map -> odom a 50 Hz, como el EKF
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000     # pila grande para serializar el mapa
    enable_interactive_mode: false  # (*) sin marcadores interactivos: menos carga en WSL
    debug_logging: false

    # Cuándo entra un escaneo nuevo al grafo: tiempo mínimo desde el anterior
    # y distancia / giro mínimos recorridos.
    throttle_scans: 1
    minimum_time_interval: 0.5
    minimum_travel_distance: 0.3    # (*) antes 0,5 m: más nodos en una bodega pequeña
    minimum_travel_heading: 0.3     # (*) antes 0,5 rad

    # Emparejamiento de escaneos y cierre de lazo (valores del ejemplo).
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_search_maximum_distance: 3.0   # busca cierres a 3 m o menos de la pose actual
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Ventana de búsqueda del emparejamiento.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Ventana de búsqueda del cierre de lazo.
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Penalizaciones del emparejamiento.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
