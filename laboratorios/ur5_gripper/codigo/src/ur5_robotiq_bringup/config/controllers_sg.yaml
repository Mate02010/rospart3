controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    speed_scaling_interface_name: ''
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint:
        trajectory: 0.2
        goal: 0.1
      shoulder_lift_joint:
        trajectory: 0.2
        goal: 0.1
      elbow_joint:
        trajectory: 0.2
        goal: 0.1
      wrist_1_joint:
        trajectory: 0.2
        goal: 0.1
      wrist_2_joint:
        trajectory: 0.2
        goal: 0.1
      wrist_3_joint:
        trajectory: 0.2
        goal: 0.1
gripper_controller:
  ros__parameters:
    joints:
    - gripper_finger_joint
    - right_finger_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      gripper_finger_joint:
        trajectory: 0.02
        goal: 0.002
      right_finger_joint:
        trajectory: 0.02
        goal: 0.002
